name: Sync from sc-rnaseq-wf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  repository_dispatch:
    types: [sc-tools-updated]  # can be fired from sc-rnaseq-wf on push

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ASAP-CRN/sc-rnaseq-wf
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Regenerate package
        id: sync
        run: echo "summary=$(python sync.py upstream)" >> "$GITHUB_OUTPUT"

      - name: Check package builds
        run: pip install --no-deps .

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sync-upstream
          add-paths: |
            src/sc_tools
            requirements.txt
            requirements-mmc.txt
            entry-points.txt
          commit-message: "Sync from sc-rnaseq-wf: ${{ steps.sync.outputs.summary }}"
          title: "Sync from sc-rnaseq-wf"
          body: "${{ steps.sync.outputs.summary }}"
          delete-branch: true
