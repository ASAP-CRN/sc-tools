[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crn-cloud-sc-tools"
description = "ASAP PMDBS sc/sn RNA-seq processing scripts (packaged from sc-rnaseq-wf/docker/sc_tools)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies", "optional-dependencies", "scripts"]

[project.urls]
Upstream = "https://github.com/ASAP-CRN/sc-rnaseq-wf/tree/main/docker/sc_tools"

# All of these are generated by sync.py
[tool.setuptools.dynamic]
version = { attr = "sc_tools.__version__" }
dependencies = { file = ["requirements.txt"] }
optional-dependencies.mmc = { file = ["requirements-mmc.txt"] }
entry-points = { file = ["entry-points.txt"] }

[tool.setuptools.package-data]
sc_tools = ["resources/*.txt"]
